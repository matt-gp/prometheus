# Regression test for https://github.com/prometheus/prometheus/issues/6092.
# Before the fix, the AWS SDs called IMDS during YAML parsing, so
# `promtool check config` failed with a network error when the region
# was omitted (which the docs say is valid).

scrape_configs:
  - job_name: 'ec2'
    aws_sd_configs:
      - role: ec2
        port: 9090
  - job_name: 'ecs'
    aws_sd_configs:
      - role: ecs
        port: 9090
  - job_name: 'rds'
    aws_sd_configs:
      - role: rds
        port: 9090
  - job_name: 'msk'
    aws_sd_configs:
      - role: msk
        port: 9090
  - job_name: 'elasticache'
    aws_sd_configs:
      - role: elasticache
        port: 9090
  - job_name: 'lightsail'
    aws_sd_configs:
      - role: lightsail
        port: 9090
